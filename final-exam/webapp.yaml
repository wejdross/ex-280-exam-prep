apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: webapp
  name: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: webapp
    spec:
      containers:
      - image: quay.io/redhattraining/hello-world-nginx:latest
        name: hello-world-nginx
        ports:
        - containerPort: 8080
          name: webapp
        readinessProbe:
          httpGet:
            scheme: HTTP
            path: /
            port: 8080
        livenessProbe:
          tcpSocket:
            port: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
status: {}
