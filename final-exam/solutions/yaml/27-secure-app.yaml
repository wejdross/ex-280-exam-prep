apiVersion: v1
kind: Service
metadata:
  name: secure-app
  namespace: ex280-t27
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: secure-app-tls
spec:
  selector:
    app: secure-app
  ports:
  - port: 8443
    targetPort: 8443
    name: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-app
  namespace: ex280-t27
  labels:
    app: secure-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-app
  template:
    metadata:
      labels:
        app: secure-app
    spec:
      containers:
      - name: server
        image: registry.access.redhat.com/ubi9/python-311:latest
        command: ["python3","-c","import http.server,ssl;ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER);ctx.load_cert_chain('/etc/tls/tls.crt','/etc/tls/tls.key');s=http.server.HTTPServer(('0.0.0.0',8443),http.server.SimpleHTTPRequestHandler);s.socket=ctx.wrap_socket(s.socket,server_side=True);s.serve_forever()"]
        ports:
        - containerPort: 8443
        volumeMounts:
        - name: tls
          mountPath: /etc/tls
          readOnly: true
      volumes:
      - name: tls
        secret:
          secretName: secure-app-tls
